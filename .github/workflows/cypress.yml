name: Cypress Automation Tests

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  cypress-tests:
    name: Run Cypress Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Dependencies and Run Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          command: npm run cy:run

      - name: Merge Mochawesome Reports
        if: always()
        run: npm run report:custom

      - name: Generate HTML Report
        if: always()
        run: npm run report:html
      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-test-reports
          path: |
            cypress/reports/custom-report/index.html
            cypress/reports/mochawesome/index.html
            cypress/reports/mochawesome/*.json
            cypress/reports/merged/combined-report.json
          if-no-files-found: warn
          retention-days: 7
