name: Cypress Automation Tests
on:
  push:
    branches:
      - "**"
permissions:
  contents: read

jobs:
  cypress-tests:
    name: Run Cypress Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Dependencies and Run Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
      - name: Upload Cypress Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-test-results
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
